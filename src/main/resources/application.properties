spring.application.name=spring-ecommerce

spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce
spring.datasource.username=ecommerce
spring.datasource.password=ecommerce_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Generate a secure secret (at least 256 bits for HS256):
#   openssl rand -base64 64
# Then export before starting the app:
#   export JWT_SECRET='your-generated-secret'
# Fallback below is for local boot only — replace in production.
application.security.jwt.secret-key=${JWT_SECRET:ThisIsALocalDevOnlySecretKeyThatIsLongEnoughForHS256Algorithms!!}
application.security.jwt.expiration=86400000
logging.file.name=logs/spring-ecommerce.log
